[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jay-terminal-assistant"
version = "0.1.0"
description = "A programming and Linux terminal AI assistant"
authors = [
    { name = "Justice Bishop", email = "globalresearchinstitution@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==3.8.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
jay = "main:main"

[tool.setuptools]
py-modules = ["main", "ai", "database", "terminal", "tools"]
